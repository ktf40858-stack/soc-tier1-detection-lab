title: Encoded PowerShell Command Line
id: 8f2a1c40-3b1e-4e77-9a2d-5c1f0e7b4a01
status: experimental
description: >
  Detects PowerShell launched with an encoded command payload (-EncodedCommand and its
  accepted abbreviations). Base64-encoding the payload is the cheapest way for an operator
  to keep the command line unreadable to an analyst and to defeat naive string matching.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://redcanary.com/threat-detection-report/techniques/powershell/
author: Kodjo Apedoh
date: 2026/09/05
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_encoded:
    CommandLine|re: '(?i)\s-(e|ec|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)\s'
  filter_known_good:
    # Tuned out after week 1: the endpoint management agent encodes its own inventory job.
    ParentImage|endswith: '\ManagementAgent\agent.exe'
  condition: selection_img and selection_encoded and not filter_known_good
fields:
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
falsepositives:
  - Endpoint management and inventory agents that wrap their own scripts
  - Some enterprise software installers (observed once, from a vendor MSI)
level: high
