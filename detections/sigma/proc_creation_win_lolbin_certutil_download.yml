title: LOLBin Used to Download a Remote File
id: 8f2a1c40-3b1e-4e77-9a2d-5c1f0e7b4a03
status: experimental
description: >
  Detects the signed Microsoft binaries most commonly abused to pull a payload from the
  internet (certutil, bitsadmin, curl, and the PowerShell download cradle). The binary is
  legitimate and signed, so only the argument pattern separates abuse from intended use.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/
author: Kodjo Apedoh
date: 2026/09/05
tags:
  - attack.command_and_control
  - attack.t1105
  - attack.defense_evasion
  - attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_certutil:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  selection_bitsadmin:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains: '/transfer'
  selection_curl:
    Image|endswith:
      - '\curl.exe'
      - '\wget.exe'
    CommandLine|contains:
      - ' -o '
      - '--output'
  selection_cradle:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
  condition: 1 of selection_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - certutil is genuinely used by some PKI maintenance scripts — check the parent process
  - curl.exe ships with Windows and is used by developer tooling; scope this rule away from developer OUs first
level: high
