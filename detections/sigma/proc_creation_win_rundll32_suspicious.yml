title: Suspicious rundll32 Execution
id: 8f2a1c40-3b1e-4e77-9a2d-5c1f0e7b4a06
status: experimental
description: >
  Detects rundll32.exe launched with no arguments, from a user-writable directory, or from
  an Office application. rundll32 is a signed proxy for arbitrary DLL code, which is why it
  is a standing favourite for both execution and defence evasion.
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: Kodjo Apedoh
date: 2026/09/05
tags:
  - attack.defense_evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\rundll32.exe'
  selection_no_args:
    CommandLine|re: '(?i)rundll32(\.exe)?"?\s*$'
  selection_user_writable:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Downloads\'
  selection_office_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  condition: selection_img and 1 of selection_no_args, selection_user_writable, selection_office_parent
fields:
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
falsepositives:
  - Rare. rundll32 with an empty command line is close to always injection or hollowing.
level: high
