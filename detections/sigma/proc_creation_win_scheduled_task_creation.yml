# SOC-005 - lab detection id. Wazuh translation: ../wazuh/local_rules.xml
title: Scheduled Task Created from a Suspicious Parent
id: 8f2a1c40-3b1e-4e77-9a2d-5c1f0e7b4a05
status: experimental
description: >
  Detects schtasks.exe creating a task when its parent is a script interpreter or an Office
  application rather than an installer. Scheduled tasks survive reboot and run under a chosen
  account, which makes them persistence and privilege escalation at once.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Kodjo Apedoh
date: 2026/09/05
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_parent:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\winword.exe'
      - '\excel.exe'
  condition: selection and selection_parent
fields:
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
falsepositives:
  - Administrative scripts that provision tasks — filter on the specific admin service account
level: medium
